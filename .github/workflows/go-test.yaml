name: go-test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: go-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version-file: go.mod

      - name: Verify dependencies
        run: make verify

      - name: Check formatting
        run: |
          make fmt
          if [ -n "$(git status --porcelain)" ]; then
            echo "Code is not formatted. Run 'make fmt' locally."
            git diff
            exit 1
          fi

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0

      - name: Run tests
        run: make test

      - name: Run tests with race detector
        run: make test-race

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Setup Golang with cache
        uses: magnetikonline/action-golang-cache@v5
        with:
          go-version-file: go.mod

      - name: Build binary
        run: make build

      - name: Verify binary exists
        run: |
          if [ ! -f bin/s3-bucket-exporter ]; then
            echo "Binary not found at bin/s3-bucket-exporter"
            exit 1
          fi
          ls -lh bin/s3-bucket-exporter

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: test
          cache-from: type=gha
          platforms: linux/amd64

  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker-build
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: E2E test
        uses: hoverkraft-tech/compose-action@v2.1.0
        with:
          compose-file: "./test/e2e/docker-compose.yaml"
          compose-flags: "--profile long"
          up-flags: "--abort-on-container-exit"
