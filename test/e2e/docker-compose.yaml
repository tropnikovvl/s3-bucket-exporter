services:
  floci:
    image: hectorvent/floci:latest
    ports:
      - "4566:4566"
    environment:
      - FLOCI_HOSTNAME=floci
    profiles:
      - short
      - long

  s3-bucket-exporter:
    build:
      context: ../../
      dockerfile: Dockerfile
    depends_on:
      - floci
    environment:
      - S3_ACCESS_KEY=test
      - S3_SECRET_KEY=test
      - S3_REGION=us-east-1
      - S3_ENDPOINT=http://floci:4566
      - S3_FORCE_PATH_STYLE=true
      - SCRAPE_INTERVAL=3s
      - LOG_LEVEL=debug
    ports:
      - "9655:9655"
    profiles:
      - short
      - long

  # Same image without static keys: credentials come only from STS
  # AssumeRoleWithWebIdentity (IRSA-style), which floci serves.
  s3-bucket-exporter-iam:
    build:
      context: ../../
      dockerfile: Dockerfile
    depends_on:
      - floci
    environment:
      - AWS_ROLE_ARN=arn:aws:iam::000000000000:role/s3-bucket-exporter
      - AWS_WEB_IDENTITY_TOKEN_FILE=/var/run/secrets/eks.amazonaws.com/serviceaccount/token
      - AWS_EC2_METADATA_DISABLED=true
      - S3_REGION=us-east-1
      - S3_ENDPOINT=http://floci:4566
      - S3_FORCE_PATH_STYLE=true
      - SCRAPE_INTERVAL=3s
      - LOG_LEVEL=debug
    volumes:
      - ./fixtures/web-identity-token:/var/run/secrets/eks.amazonaws.com/serviceaccount/token:ro
    profiles:
      - short
      - long

  test-runner-short:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - floci
      - s3-bucket-exporter
      - s3-bucket-exporter-iam
    environment:
      - S3_ACCESS_KEY=test
      - S3_SECRET_KEY=test
      - S3_REGION=us-east-1
      - S3_ENDPOINT=http://floci:4566
      - S3_EXPORTER_URL=http://s3-bucket-exporter:9655/metrics
      - S3_EXPORTER_IAM_URL=http://s3-bucket-exporter-iam:9655/metrics
      - TEST_PROFILE=short
    volumes:
      - ./tests:/app/tests
    profiles:
      - short

  test-runner-long:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - floci
      - s3-bucket-exporter
      - s3-bucket-exporter-iam
    environment:
      - S3_ACCESS_KEY=test
      - S3_SECRET_KEY=test
      - S3_REGION=us-east-1
      - S3_ENDPOINT=http://floci:4566
      - S3_EXPORTER_URL=http://s3-bucket-exporter:9655/metrics
      - S3_EXPORTER_IAM_URL=http://s3-bucket-exporter-iam:9655/metrics
      - TEST_PROFILE=long
    volumes:
      - ./tests:/app/tests
    profiles:
      - long
